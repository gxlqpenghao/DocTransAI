[project]
name = "doctransai"
version = "1.2.0"
description = "Template-driven document transformation with structured evidence and provenance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "openpyxl>=3.1,<3.2",
  "pillow>=11,<12",
  "python-docx>=1.2,<1.3",
]

[project.scripts]
doctransai = "doctransai.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[tool.uv]
package = true

[tool.setuptools.package-data]
doctransai = ["prompts/*.md", "data_layer/contracts/*.json"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
